<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Auto Adrenaline</title>
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
     <img class="AALO" src="/Assets/Auto-Adrenaline.png" alt="Auto-Adrenaline-Game-Logo">
    <div class="game-container">
        <canvas id="game-canvas" width="800" height="400"></canvas>
    </div>
    <div id="ui">
        <button id="start-btn">Start</button>
        <button id="restart-btn" class="hidden">Opnieuw</button>
        <div id="score">Score: 0</div>

        <div id="controls">
            <p>Gebruik W, S of de buttons om omhoog en omlaag te gaan om politie te vermijden!
            </p>
            <button id="btn-up">Up</button>
            <button id="btn-down">Down</button>
        </div>
    </div>
    

    <!-- Scripts -->
    <script src="Javascript/model/game.js"></script>
    <script src="Javascript/view/view.js"></script>
    <script src="Javascript/controller/controller.js"></script>
    <script src="Javascript/start.js"></script>
</body>

</html>
